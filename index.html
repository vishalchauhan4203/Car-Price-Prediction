<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <title>Car Price Predictor</title>
</head>

<body class="bg-dark">

    <div class="container">

        <div class="row">

            <div class="card mt-50"
                style="width: 100%; height: 100%;">

                <!-- Header -->
                <div class="card-header">

                    <div class="col-12"
                        style="text-align: center">

                        <h1>Welcome to Car Price Predictor</h1>

                    </div>

                </div>


                <!-- Body -->
                <div class="card-body">

                    <form method="post"
                        accept-charset="utf-8"
                        onsubmit="send_data(event)">


                        <!-- Company -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <label>
                                <b>Select Company:</b>
                            </label>

                            <select class="selectpicker form-control"
                                id="company"
                                name="company"
                                required
                                onchange="load_car_models(this.id,'car_model')">

                                {% for company in companies %}

                                <option value="{{ company }}">
                                    {{ company }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Model -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <label>
                                <b>Select Model:</b>
                            </label>

                            <select class="selectpicker form-control"
                                id="car_model"
                                name="car_model"
                                required>

                                <option value="">
                                    Select Model
                                </option>

                                {% for model in car_models %}

                                <option value="{{ model }}">
                                    {{ model }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Year -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <label>
                                <b>Select Year of Purchase:</b>
                            </label>

                            <select class="selectpicker form-control"
                                id="year"
                                name="year"
                                required>

                                <option value="">
                                    Select Year
                                </option>

                                {% for y in years %}

                                <option value="{{ y }}">
                                    {{ y }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Fuel Type -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <label>
                                <b>Select Fuel Type:</b>
                            </label>

                            <select class="selectpicker form-control"
                                id="fuel_type"
                                name="fuel_type"
                                required>

                                <option value="">
                                    Select Fuel Type
                                </option>

                                {% for fuel in fuel_type %}

                                <option value="{{ fuel }}">
                                    {{ fuel }}
                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Kilometers -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <label>
                                <b>
                                    Enter Number of Kilometers travelled:
                                </b>
                            </label>

                            <input class="form-control"
                                type="text"
                                id="kilo_driven"
                                name="kilo_driven"
                                placeholder="Enter Kilometers driven"
                                required>

                        </div>


                        <!-- Predict Button -->
                        <div class="col-10 form-group"
                            style="text-align: center">

                            <button class="btn btn-primary form-control"
                                type="submit">

                                Predict Price

                            </button>

                        </div>

                    </form>


                    <!-- Prediction Result -->
                    <br>

                    <div class="row">

                        <div class="col-12"
                            style="text-align:center">

                            <h3>
                                <span id="prediction"></span>
                            </h3>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


<script>

function load_car_models(company_id, car_model_id)
{
    var company = document.getElementById(company_id);

    var car_model =
        document.getElementById(car_model_id);

    car_model.value = '';
    car_model.innerHTML = '';


    {% for company in companies %}

    if(company.value == "{{ company }}")
    {

        {% for model in car_models %}

        {% if company in model %}

        var newOption =
            document.createElement("option");

        newOption.value =
            "{{ model }}";

        newOption.innerHTML =
            "{{ model }}";

        car_model.options.add(newOption);

        {% endif %}

        {% endfor %}

    }

    {% endfor %}
}


function send_data(event)
{
    event.preventDefault();


    var form =
        document.querySelector('form');


    var fd =
        new FormData(form);


    var xhr =
        new XMLHttpRequest();


    xhr.open('POST', '/predict', true);


    xhr.onreadystatechange = function()
    {

        if(xhr.readyState == XMLHttpRequest.DONE)
        {

            document.getElementById('prediction').innerHTML =
                "₹ " + xhr.responseText;

        }

    };


    xhr.send(fd);

}

</script>

</body>

</html>
